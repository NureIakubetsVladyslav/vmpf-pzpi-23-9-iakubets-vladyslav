{% load static %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Організації</title>

    <link rel="stylesheet" href="{% static 'organizations/style.css' %}">
</head>
<body>

    <div class="container">

        <h1>Список громадських організацій</h1>

        {% for organization in organizations %}

            <div class="card">

                <h2>
                    <a href="/organization/{{ organization.id }}/">
                        {{ organization.name }}
                    </a>
                </h2>

                <p>{{ organization.description }}</p>

                <p class="volunteers">
                    Кількість волонтерів:
                    {{ organization.volunteers_count }}
                </p>

            </div>

        {% endfor %}

    </div>

</body>
</html>
